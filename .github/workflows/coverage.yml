name: JaCoCo Code Coverage

on:
  pull_request:
    branches: ["master"]

# Required permissions for posting PR comments
permissions:
  contents: read
  pull-requests: write

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Enable KVM for hardware acceleration on Ubuntu runner
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-rules.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      # Runs the emulator AND executes your mergedCoverageReport Gradle task
      - name: Run Tests and Generate JaCoCo Report
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Nexus 6
          script: ./gradlew mergedCoverageReport --stacktrace

      # Parses the generated XML report and posts a comment on the PR
      - name: Post JaCoCo Coverage Comment
        uses: madrapps/jacoco-coverage-report@v1.6.1
        if: always() # Ensures comment posts even if test assertions fail
        with:
          paths: ${{ github.workspace }}/app/build/reports/jacoco/mergedCoverageReport/mergedCoverageReport.xml # Adjust 'app/' if your module name is different
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 50
          min-coverage-changed-files: 70
          title: "📊 JaCoCo Code Coverage Report"
          update-comment: true